<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: #f4f6f8;
        }
        .login-box {
            width: 380px; padding: 40px; background: white; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }
        .logo { text-align: center; color: #2563eb; font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px;
        }
        input:focus { outline: none; border-color: #2563eb; }
        button {
            width: 100%; padding: 13px; border: none; border-radius: 6px;
            background: #2563eb; color: white; font-size: 16px; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        #message { text-align: center; margin-top: 20px; font-size: 14px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">TaskFlow</div>
        <p class="subtitle">Sign in to your account</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (email === "" || password === "") {
                message.textContent = "Please enter your email and password.";
                message.className = "error";
                return;
            }

            if (password.length < 6) {
                message.textContent = "Password must be at least 6 characters.";
                message.className = "error";
                return;
            }

            message.textContent = "Login successful!";
            message.className = "success";
        });
    </script>
</body>
</html>
